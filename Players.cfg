Python
cfg_content = """# ==============================================================================
#            PARKOUR AUTOMATICS — БАЗА ПОЛЬЗОВАТЕЛЕЙ И ПОДПИСОК
# ==============================================================================
# В этом файле настраивается уровень доступа игроков (никнеймов) к функциям мода.
#
# Формат записи:
#   "Никнейм_Игрока" = "Название_Тарифа"
#
# Доступные тарифы (должны точно совпадать с секциями из ParkourAutomatics_Tiers.cfg):
#   Limited1  -> Базовый / Бесплатный уровень (минимальные лимиты, часть кнопок закрыта)
#   Limited2  -> Продвинутый уровень (расширенные лимиты, доступ к авторестарту и ESP)
#   Limited3  -> Профессиональный уровень (почти все функции и максимальные радиусы)
#   Unlimited -> Полный VIP-доступ без ограничений
#   Banned    -> Полная блокировка (доступ к предустановкам запрещен)
# ==============================================================================


[Users]
# ==============================================================================
# 👑 РАЗРАБОТЧИКИ И АДМИНИСТРАЦИЯ (Unlimited)
# ==============================================================================
"Admin_Main"        = "Unlimited"    # Главный администратор мода
"Dev_ScriptMaster"  = "Unlimited"    # Разработчик и тестировщик систем


# ==============================================================================
# 💎 VIP ПОЛЬЗОВАТЕЛИ (Unlimited)
# ==============================================================================
"ProGamer2026"      = "Unlimited"    # Постоянный VIP-клиент
"CyberJumper"       = "Unlimited"    # Победитель ивента (вечный доступ)
"Shadow_Ninja"      = "Unlimited"    # Премиум-подписка


# ==============================================================================
# 🥇 ТАРИФ: LIMITED 3 (Профессиональный уровень)
# ==============================================================================
"ParkourKing_99"    = "Limited3"     # Подписка активна
"Speedrun_Legend"   = "Limited3"     # Подписка активна
"MasterOfBlocks"    = "Limited3"     # Продлил доступ на 3 месяца
"SkyWalker_X"       = "Limited3"     # Активный пользователь


# ==============================================================================
# 🥈 ТАРИФ: LIMITED 2 (Продвинутый уровень)
# ==============================================================================
"Jumper_007"        = "Limited2"     # Ежемесячная подписка
"Craft_Bro"         = "Limited2"     # Стандартный тариф
"Redstone_God"      = "Limited2"     # Перешел с Limited1
"FastClicker"       = "Limited2"     # Активная подписка


# ==============================================================================
# 🥉 ТАРИФ: LIMITED 1 (Бесплатный / Ознакомительный уровень)
# ==============================================================================
"Newbie_Player"     = "Limited1"     # Стартовый триал-доступ
"Guest_8472"        = "Limited1"     # Бесплатный аккаунт
"Test_User_01"      = "Limited1"     # Проверочный профиль
"JustPlaying"       = "Limited1"     # Базовый тариф


# ==============================================================================
# 🚫 ЧЕРНЫЙ СПИСОК (Banned - доступ заблокирован)
# ==============================================================================
"Cheater_Abuser"    = "Banned"       # Заблокирован за попытку обхода лимитов
"Spam_Bot_00"       = "Banned"       # Нарушение правил использования
"""

file_path = "ParkourAutomatics_Users.cfg"
with open(file_path, "w", encoding="utf-8") as f:
    f.write(cfg_content)

print(f"File generated: {file_path}")

