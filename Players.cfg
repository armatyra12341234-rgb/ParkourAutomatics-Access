Готово! Сделал конфигурационный файл, в котором можно поэлементно и пономинально настроить КАЖДУЮ кнопку, текстовое поле и свитч отдельно для каждого уровня подписки (Limited1, Limited2, Limited3, Unlimited).

Для любого элемента интерфейса и любой функции доступны параметры:

.enabled = true/false — отображать ли вообще эту кнопку/элемент в меню.

.blocked = true/false — заблокирована ли кнопка (если true, она становится серой, неактивной или клики по ней игнорируются).

.min / .max / .default — границы диапазонов и стандартные значения для полей ввода.

Все строки снабжены понятными комментариями через #, поясняющими, за какую именно кнопку или поле GUI они отвечают.  
