# ==============================================================================
#            PARKOUR AUTOMATICS — ПОЛНАЯ НАСТРОЙКА КНОПОК И ТАРИФОВ
# ==============================================================================
# Этот файл позволяет гибко управлять каждой кнопкой, переключателем и полем
# ввода в интерфейсах Legacy (K) и Smart (;), а также задавать лимиты для
# разных подписок: Limited1, Limited2, Limited3 и Unlimited.
#
# Расшифровка флагов управления для каждого элемента:
#   .enabled = true/false  -> Показывать ли элемент в GUI (true - да, false - скрыть)
#   .blocked = true/false  -> Блокировка кнопки (true - сделать серой/неактивной)
#   .default               -> Дефолтное значение поля/кнопки
#   .min / .max            -> Разрешенный диапазон ввода чисел
# ==============================================================================


# ==============================================================================
# ТАРИФ: LIMITED 1 (Базовый / Бесплатный уровень)
# ==============================================================================
[Tier.Limited1]
tier_display_name = "Limited Tier 1"

# ------------------------------------------------------------------------------
# 1.1. ЭКРАН LEGACY GUI (Клавиша K) — MainScreen.java
# ------------------------------------------------------------------------------
