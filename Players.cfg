Создал удобный конфигурационный файл ParkourAutomatics_Users.cfg, который работает как таблица доступа и напрямую связывает никнеймы игроков с тарифами, настроенными в предыдущем файле.

💡 Как устроена структура этого файла:
Простой табличный формат: Каждая строка — это четкая привязка вида "Никнейм" = "Тариф".

Синхронизация тарифной сетки: Доступные уровни (Limited1, Limited2, Limited3, Unlimited) точно соответствуют секциям из основного файла настроек GUI.

Блокировка доступа (Banned): Добавлен отдельный статус для моментального отключения доступа нарушителям.

Подробные комментарии #: Можно прямо напротив каждого игрока делать пометки для себя (например: до какого числа активен доступ, кто это такой или за что выдан бан).

