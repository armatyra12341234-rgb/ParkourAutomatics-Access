Конфигурационный файл ParkourAutomatics_Tiers.cfg создан на основе всех переменных из исходного кода (ModConfig.java). В него включены абсолютно все параметры для тонкой настройки мода, а также структура системы подписок.

📂 Как устроен созданный файл конфигурации:
1. Глобальные лимиты и значения по умолчанию ([Global])
Каждой переменной из кода прописаны три ключевых параметра (где применимо):

.default — стандартное значение, установленное в твоём коде по умолчанию.

.min / .max — безопасные границы диапазонов для чисел (таймауты, радиусы, задержки, повторы, высоты и тики), чтобы при тонкой настройке скрипт не выходил за адекватные пределы.

Булевые флаги (включение/выключение HUD, ходьбы, стекла, умного сброса паники и т.д.).

2. Система подписок и блокировки кнопок ([Subscription])
Реализовано 4 тарифных плана согласно твоему запросу:

[Subscription.Limited1] (Starter):

enabled = true (статус подписки).

blockedFeatures: список заблокированных функций, где кнопки в GUI будут неактивны (например, блокировка спасения телепортацией к плитам "smartUsePlateRescue", блокировка бесконечного режима, авторестарта и визуального ESP-хитбокса).

limits: жёсткие урезанные лимиты (например, максимум 50 повторов, радиус поиска блоков до 3x2).

[Subscription.Limited2] (Advanced):

Открывает авторестарт и телепорт к плитам, увеличивает радиусы поиска (до 7x5) и лимит повторов до 250, но всё ещё блокирует бесконечный режим и визуальный радар паники.

[Subscription.Limited3] (Pro):

Доступен почти весь функционал, радиусы до 10x8, до 1000 повторов и минимальные задержки. Заблокирована только полная бесконечность (smartIsInfinite).

[Subscription.Unlimited] (VIP):

blockedFeatures = [] — список блокировок пуст. Все кнопки активны, все ограничения сняты до максимальных глобальных значений (до 10 000 повторов, радиусы до 15x15, нулевые задержки).

🛠 Что включено в настройки (по разделам):
Legacy ([Global.Legacy]): таймеры бега и ожидания в тиках (runTicks, waitTicks), количество циклов, ходьба, автоповтор, режим «всё стекло» и список целевых блоков.

Smart Main ([Global.Smart.Main]): таймеры начального бега и дошагивания, лимиты микро-шагов, минимальная высота сброса smartMinStartY, горизонтальные и вертикальные радиусы, задержки циклов, настройки спасения через нажимные плиты (smartUsePlateRescue, smartPlateRadius).

Smart PPD ([Global.Smart.PPD]): радар паники, таймауты присутствия игроков рядом, радиусы сканирования и умная пауза сброса.

HUD & ESP ([Global.HUD]): глобальный выключатель интерфейса, отображение этапов, блоков, таймеров и отрисовка 3D-хитбоксов прыжка и паники.

Файл полностью готов для интеграции в систему проверки подписок и построения логики блокировки GUI в твоих экранах (MainScreen и SmartScreen).

